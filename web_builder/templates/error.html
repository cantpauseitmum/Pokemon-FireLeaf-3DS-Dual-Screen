<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - FireLeaf 3DS</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #ff7b72;
        }
        h1 { color: #ff7b72; }
        pre {
            background: #0d1117;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            overflow-x: auto;
            border: 1px solid #30363d;
            color: #ff7b72;
        }
        a.back-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
        }
        a.back-btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Compilation Failed</h1>
        <p>{{ error_message }}</p>
        {% if logs %}
            <pre>{{ logs }}</pre>
        {% endif %}
        <a href="/" class="back-btn">Return to Home</a>
    </div>
</body>
</html>
