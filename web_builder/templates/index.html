<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>FireLeaf 3DS Web Builder</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        h1 { color: #58a6ff; }
        .upload-area {
            border: 2px dashed #30363d;
            padding: 40px;
            margin: 20px 0;
            border-radius: 8px;
            background: #0d1117;
        }
        input[type="file"] { margin-bottom: 20px; }
        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2ea043; }
        p.info { font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠 FireLeaf 3DS Web Builder</h1>
        <p>Wgraj swój oryginalny plik <strong>Pokémon FireRed (U) 1.0 (Squirrels).gba</strong>, aby rozpocząć proces kompilacji do natywnej wersji na 3DS-a.</p>
        
        <form action="/build" method="post" enctype="multipart/form-data">
            <div class="upload-area">
                <input type="file" name="rom_file" accept=".gba" required>
            </div>
            <button type="submit" onclick="this.innerHTML='Kompiluję... (to zajmie chwilę)'; this.style.opacity='0.7';">
                Wygeneruj grę (.cia)
            </button>
        </form>
        <p class="info">Twoja gra nigdzie nie zostaje wysłana. Proces odbywa się lokalnie przy użyciu devkitARM.</p>
    </div>
</body>
</html>
